# GitHub Actions workflow: Build with Maven, run SonarCloud scan, and publish package

name: Maven Package with SonarCloud

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}


    - name: Build with Maven
      run: mvn -B package --file pom.xml

    
    - name: Set IMAGE_NAME to repo name
      run: echo "IMAGE_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

    - name: Docker Build
      run: docker build -t $IMAGE_NAME:v1 .
      
    - name: Save Docker image info
      run: echo "$IMAGE_NAME:v1" > $IMAGE_NAME.txt

    - name: Upload image info artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_NAME }}
        path: ${{ env.IMAGE_NAME }}.txt

    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
